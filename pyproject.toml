[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "restorecheck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.2", "psycopg[binary]==3.2.3", "boto3==1.35.76"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
restorecheck = "restorecheck.cli:main"

[tool.setuptools.packages.find]
include = ["restorecheck*"]
